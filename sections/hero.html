<section class="hero" id="hero">
  <div class="hero__bg" aria-hidden="true">
    <div class="hero__gradient-wrap">
      <img
        src="assets/figma-export/hero-gradient-v2.jpg"
        alt=""
        class="hero__gradient"
        width="1440"
        height="808"
        fetchpriority="high"
      >
    </div>
    <div class="hero__curve-band">
      <img
        src="assets/figma-export/hero-curved-section.png"
        alt=""
        class="hero__curve-section"
        width="1445"
        height="266"
      >
    </div>
  </div>

  <div class="hero__inner">
    <header class="hero__header">
      <a href="/" class="hero__logo">
        <img
          src="assets/figma-hero/logo-icon-white.svg"
          alt=""
          class="hero__logo-icon"
          width="40"
          height="40"
        >
        <span class="hero__logo-text">fastbridge</span>
      </a>
      <button type="button" class="btn btn--secondary hero__nav-btn">Bridge Now</button>
    </header>

    <h1 class="hero__title">
      <span class="hero__title-desktop">Move Your Crypto across chains One Transaction</span>
      <span class="hero__title-tablet">Move All Your Crypto<br>In One Transaction</span>
      <span class="hero__title-mobile">
        <span class="hero__title-line">Move All Your</span>
        <span class="hero__title-line">Crypto In One</span>
        <span class="hero__title-line">Transaction</span>
      </span>
    </h1>

    <div class="hero__panel">
      <p class="hero__desc">
        Combine your balances from multiple chains in a single move. No switching networks, no managing gas, no waiting. Arrive ready to trade.
      </p>
      <div class="hero__actions">
        <button type="button" class="btn btn--primary">Bridge Now</button>
        <a
          href="https://docs.availproject.org/docs/nexus/get-started"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn--secondary"
        >Add FastBridge</a>
      </div>
    </div>
  </div>
</section>
